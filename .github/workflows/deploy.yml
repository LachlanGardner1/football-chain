name: Deploy

# Builds the app + ops Lambda, applies Terraform, then runs pending DB migrations via the ops
# Lambda's "migrate" action - RDS is private (infra/TERRAFORM_CHECKLIST.md's "No public RDS"
# gate), so that Lambda invocation is the only way anything outside the VPC can apply schema
# changes. Auth to AWS is via GitHub OIDC (infra/environments/github-oidc) - no stored keys.
#
# Requires the one-time github-oidc bootstrap (see infra/TERRAFORM_CHECKLIST.md) to already be
# applied, and these repo variables set (Settings -> Secrets and variables -> Actions ->
# Variables): AWS_REGION, AWS_DEPLOY_ROLE_ARN (from that bootstrap's `deploy_role_arn` output).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A push to main always targets dev; prod is manual-dispatch-only. Pair the "prod"
    # GitHub Environment (Settings -> Environments) with required reviewers if you want a
    # manual approval gate on top of that - this workflow doesn't enforce one itself.
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TF_ENV_DIR: infra/environments/${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: Build the Next.js app for Lambda (OpenNext)
        run: npx open-next build

      - name: Build the ops Lambda bundle (migrate / rotate-puzzles)
        run: npm run build:ops-lambda

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -input=false

      # dev's TF_VAR_neon_database_url / prod's TF_VAR_db_password + TF_VAR_db_username are
      # sensitive, no-default Terraform variables - each only exists as a secret on the
      # matching GitHub Environment, so the "other" environment's vars simply resolve to an
      # empty string here and Terraform never references them (dev's variables.tf has no
      # db_password variable to fail on, and vice versa).
      #
      # -input=false everywhere below: without it, a missing required variable makes Terraform
      # silently prompt on stdin instead of erroring - harmless locally, but on a non-interactive
      # CI runner that prompt just hangs forever with no further log output, indistinguishable
      # from a genuinely stuck process. Learned this the hard way - every plan/apply-adjacent
      # command needs this flag, not just the ones that seemed most likely to hit it.
      - name: terraform plan
        working-directory: ${{ env.TF_ENV_DIR }}
        env:
          TF_VAR_neon_database_url: ${{ secrets.NEON_DATABASE_URL }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        working-directory: ${{ env.TF_ENV_DIR }}
        env:
          TF_VAR_neon_database_url: ${{ secrets.NEON_DATABASE_URL }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Run pending DB migrations
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          set -euo pipefail
          FUNCTION_NAME=$(terraform output -raw ops_lambda_function_name)
          echo "Invoking $FUNCTION_NAME with action=migrate"

          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"migrate"}' \
            --query 'FunctionError' --output text \
            response.json > function_error.txt

          cat response.json
          echo

          FUNCTION_ERROR=$(cat function_error.txt)
          if [ "$FUNCTION_ERROR" != "None" ]; then
            echo "::error::ops Lambda invocation errored: $FUNCTION_ERROR"
            exit 1
          fi

          if ! jq -e '.ok == true' response.json > /dev/null; then
            echo "::error::migrate action did not report ok:true"
            exit 1
          fi
