name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the ops/app Lambdas' nodejs20.x runtime (infra/modules/lambda_app,
          # infra/modules/ops_lambda) and esbuild's --target=node20.
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
