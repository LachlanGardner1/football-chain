services:
  postgres:
    image: postgres:16
    container_name: football-chain-postgres
    environment:
      POSTGRES_DB: football_chain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_chain"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
